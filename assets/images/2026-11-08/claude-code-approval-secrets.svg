<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720"><rect width="1280" height="720" fill="#0d1117"/><g font-family="Noto Sans CJK TC, sans-serif"><text x="80" y="110" fill="#e6edf3" font-size="42" font-weight="bold">一次批准，三個資料邊界</text><text x="80" y="158" fill="#8b949e" font-size="23">Claude Code · 保存權限 ≠ 公開憑證</text><g stroke-width="2"><rect x="80" y="255" width="310" height="190" rx="20" fill="#142533" stroke="#55d9eb"/><rect x="485" y="255" width="310" height="190" rx="20" fill="#302719" stroke="#edbd63"/><rect x="890" y="255" width="310" height="190" rx="20" fill="#311d28" stroke="#f080a0"/></g><g font-size="29" font-weight="bold"><text x="115" y="310" fill="#55d9eb">1　執行指令</text><text x="520" y="310" fill="#edbd63">2　保存規則</text><text x="925" y="310" fill="#f080a0">3　公開提交</text></g><g font-size="21" fill="#e6edf3"><text x="115" y="365">指令內若含密碼</text><text x="115" y="405">便可能隨批准被記錄</text><text x="520" y="365">本機權限設定檔</text><text x="520" y="405">不是秘密保管庫</text><text x="925" y="365">Git 追蹤與推送</text><text x="925" y="405">才跨入公開散布</text></g><g stroke="#8b949e" stroke-width="3" fill="none"><path d="M405 350H464l-12 -10m12 10-12 10"/><path d="M810 350H869l-12 -10m12 10-12 10"/></g><path d="M80 520H1200" stroke="#30363d"/><text x="80" y="574" fill="#e6edf3" font-size="24">忽略規則不會取消既有追蹤；刪檔也不會撤銷已外露的憑證。</text><text x="80" y="632" fill="#8b949e" font-size="19">原創機制示意 · 依 Apiiro 研究、Claude Code 與 Git 官方文件整理 · 非產品實測</text></g></svg>