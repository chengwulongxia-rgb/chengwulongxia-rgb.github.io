<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1260" viewBox="0 0 800 1260"><rect width="800" height="1260" fill="#0d1117"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8e9dad" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="45" y="57" font-size="34" fill="#f0f6fc" font-weight="bold">SkillPrivus：三種不同的證據</text><text x="45" y="106" font-size="26" fill="#b4bec9">抽取是否完整、判斷是否相近、實際是否造成後果</text><rect x="45" y="150" width="710" height="175" rx="16" fill="#161e29" stroke="#b4bec9" stroke-width="2"/><text x="70" y="198" font-size="31" fill="#b4bec9" font-weight="bold">輸入：功能宣告與技能檔案</text><text x="70" y="244" font-size="27" fill="#e1e8f1">claim c ＋ 指令／程式 F</text><text x="70" y="284" font-size="27" fill="#e1e8f1">研究不執行技能</text><path d="M400,333 L400,368" stroke="#8e9dad" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="383" width="710" height="215" rx="16" fill="#161e29" stroke="#e5b66a" stroke-width="2"/><text x="70" y="431" font-size="31" fill="#e5b66a" font-weight="bold">1. 抽取資料操作與來源證據</text><text x="70" y="477" font-size="27" fill="#e1e8f1">Read · Infer · Save · Send · Delete</text><text x="70" y="517" font-size="27" fill="#e1e8f1">附原碼位置，不代表抽取已完整驗證</text><text x="70" y="557" font-size="27" fill="#e1e8f1">圖5的 POST 就曾被抽取器記成 Read</text><path d="M400,606 L400,641" stroke="#8e9dad" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="656" width="710" height="215" rx="16" fill="#161e29" stroke="#63d4e3" stroke-width="2"/><text x="70" y="704" font-size="31" fill="#63d4e3" font-weight="bold">2. 比較資料流與用途規範</text><text x="70" y="750" font-size="27" fill="#e1e8f1">規範近似：功能宣告 ∩ 資料領域慣例</text><text x="70" y="790" font-size="27" fill="#e1e8f1">人工看來源與系統已抽取的資料流</text><text x="70" y="830" font-size="27" fill="#e1e8f1">83.2%是可判定操作的平均一致率</text><path d="M400,879 L400,914" stroke="#8e9dad" stroke-width="2" marker-end="url(#a)"/><rect x="45" y="929" width="710" height="215" rx="16" fill="#161e29" stroke="#a8e4bc" stroke-width="2"/><text x="70" y="977" font-size="31" fill="#a8e4bc" font-weight="bold">3. 輸出 Privacy Card</text><text x="70" y="1023" font-size="27" fill="#e1e8f1">彙整被標記的資料、目的與接收方</text><text x="70" y="1063" font-size="27" fill="#e1e8f1">每項標記可回查支持它的來源證據</text><text x="70" y="1103" font-size="27" fill="#e1e8f1">不是執行權限，也不是已發生損害的證明</text><text x="45" y="1210" font-size="24" fill="#b4bec9">依論文v1 §3–4、§8與圖5整理；本站未執行模型。</text></g></svg>