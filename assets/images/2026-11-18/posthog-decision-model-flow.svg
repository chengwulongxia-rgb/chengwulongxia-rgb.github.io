<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1940" viewBox="0 0 800 1940"><rect width="800" height="1940" fill="#0d1117"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="none" stroke="#8997a8" stroke-width="1.5"/></marker></defs><g font-family="Noto Sans CJK TC, Noto Sans TC, sans-serif"><text x="45" y="57" font-size="33" fill="#f0f6fc" font-weight="bold">Replay Vision：未被要求個資的檢查</text><text x="45" y="105" font-size="24" fill="#aab8c8">PR #120387 合併版本 · 原碼靜態資料流</text><rect x="45" y="150" width="710" height="180" rx="16" fill="#161e29" stroke="#58d5e8" stroke-width="2"/><text x="70" y="198" font-size="30" fill="#58d5e8" font-weight="bold">輸入：已生成的摘要文字</text><text x="70" y="245" font-size="27" fill="#e1e8f1">title、summary、reasoning、notability_reason</text><text x="70" y="285" font-size="27" fill="#e1e8f1">這一步不是直接檢查原始錄影</text><path d="M400,338 L400,371" stroke="#8997a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="385" width="710" height="180" rx="16" fill="#161e29" stroke="#e8ba67" stroke-width="2"/><text x="70" y="433" font-size="30" fill="#e8ba67" font-weight="bold">先問：掃描問題是否要求身分？</text><text x="70" y="480" font-size="27" fill="#e1e8f1">分數 ≥ 0.5：允許保留該次身分值</text><text x="70" y="520" font-size="27" fill="#e1e8f1">未知 None：記 unavailable，傳回原答案</text><path d="M400,573 L400,606" stroke="#8997a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="620" width="710" height="180" rx="16" fill="#161e29" stroke="#58d5e8" stroke-width="2"/><text x="70" y="668" font-size="30" fill="#58d5e8" font-weight="bold">建立待檢副本</text><text x="70" y="715" font-size="27" fill="#e1e8f1">若允許身分，將那些值替換成 the user</text><text x="70" y="755" font-size="27" fill="#e1e8f1">原答案仍可保留允許的身分</text><path d="M400,808 L400,841" stroke="#8997a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="855" width="710" height="180" rx="16" fill="#161e29" stroke="#58d5e8" stroke-width="2"/><text x="70" y="903" font-size="30" fill="#58d5e8" font-weight="bold">同一請求，分開問兩題</text><text x="70" y="950" font-size="27" fill="#e1e8f1">是否出現真人姓名？</text><text x="70" y="990" font-size="27" fill="#e1e8f1">是否出現個人聯絡資料／識別資訊？</text><path d="M400,1043 L400,1076" stroke="#8997a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="1090" width="710" height="220" rx="16" fill="#161e29" stroke="#e8ba67" stroke-width="2"/><text x="70" y="1138" font-size="30" fill="#e8ba67" font-weight="bold">取兩題最高分，與 0.4 比較</text><text x="70" y="1185" font-size="27" fill="#e1e8f1">≥ 0.4：進入重寫</text><text x="70" y="1225" font-size="27" fill="#e1e8f1">低於門檻：記 clean，回原答案</text><text x="70" y="1265" font-size="27" fill="#e1e8f1">缺題或呼叫失敗：None，回原答案</text><path d="M400,1318 L400,1351" stroke="#8997a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="1365" width="710" height="180" rx="16" fill="#161e29" stroke="#bba6ed" stroke-width="2"/><text x="70" y="1413" font-size="30" fill="#bba6ed" font-weight="bold">僅已標記的答案：Gemini 重寫一次</text><text x="70" y="1460" font-size="27" fill="#e1e8f1">一般重寫錯誤：失敗</text><text x="70" y="1500" font-size="27" fill="#e1e8f1">gateway refusal：拋回 activity 邊界處理</text><path d="M400,1553 L400,1586" stroke="#8997a8" stroke-width="2" marker-end="url(#arrow)"/><rect x="45" y="1600" width="710" height="220" rx="16" fill="#161e29" stroke="#ef9aad" stroke-width="2"/><text x="70" y="1648" font-size="30" fill="#ef9aad" font-weight="bold">重查重寫結果</text><text x="70" y="1695" font-size="27" fill="#e1e8f1">仍為 True：PII_DETECTED，失敗</text><text x="70" y="1735" font-size="27" fill="#e1e8f1">False：傳回重寫結果</text><text x="70" y="1775" font-size="27" fill="#e1e8f1">None：此版本也會傳回重寫結果</text><text x="45" y="1885" font-size="23" fill="#aab8c8">框內已回傳或拋錯的分支，不再沿箭頭向下執行。</text></g></svg>